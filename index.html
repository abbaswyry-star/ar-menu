<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu Table View</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #111; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    
    .ar-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      z-index: 9999;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="ar-viewer"
    src="3DModel.glb" 
    ios-src="3DModel.usdz" 
    alt="3D AR Menu" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    ar-scale="auto"
    ar-placement="floor"
    camera-controls 
    auto-rotate>
    
    <button slot="ar-button" class="ar-button" id="android-ar-btn">
      📷 افتح الكاميرا وضعه على الطاولة
    </button>
  </model-viewer>

  <script>
    const arBtn = document.getElementById('android-ar-btn');
    
    arBtn.addEventListener('click', (e) => {
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isAndroid) {
        e.preventDefault();
        // رابط استدعاء Scene Viewer المباشر للأندرويد
        const glbUrl = "https://abbaswry-star.github.io/ar-menu/3DModel.glb";
        const intentUrl = `intent://arvr.google.com/scene-viewer/1.0?file=${glbUrl}&mode=ar_only&title=الوجبة#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;end;`;
        window.location.href = intentUrl;
      }
    });
  </script>

</body>
</html>
