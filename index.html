<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu Table View</title>
  <!-- مكتبة model-viewer الرسمية -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #111; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    
    .ar-button {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #28a745;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <model-viewer 
    id="ar-viewer"
    src="3DModel.glb" 
    ios-src="3DModel.usdz" 
    alt="3D AR Menu" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    ar-scale="auto"
    ar-placement="floor"
    camera-controls 
    auto-rotate>
    
    <button slot="ar-button" class="ar-button" id="start-ar">
      📷 افتح الكاميرا وضعه على الطاولة
    </button>
  </model-viewer>

  <script>
    // كود تشغيل الكاميرا فوراً للأندرويد والآيفون عند اللمس
    const viewer = document.getElementById('ar-viewer');
    const arButton = document.getElementById('start-ar');

    arButton.addEventListener('click', () => {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      }
    });
  </script>

</body>
</html>
