<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عرض الوجبة بالواقع المعزز</title>
  <!-- مكتبة model-viewer الرسمية من جوجل -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #ffffff; }
  </style>
</head>
<body>

  <!-- هذا العنصر يتعرف على الجهاز تلقائياً -->
  <model-viewer 
    src="model.glb" 
    ios-src="model.usdz" 
    alt="نموذج 3D" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    camera-controls 
    auto-rotate>
  </model-viewer>

</body>
</html>
