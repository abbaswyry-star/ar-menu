<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Menu Showcase</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #f8f9fa; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    
    /* تصميم زر الواقع المعزز */
    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="3DModel.glb" 
    ios-src="3DModel.usdz" 
    alt="3D Model" 
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    camera-controls 
    touch-action="pan-y"
    auto-rotate>
    
    <button slot="ar-button" class="ar-button">
      📱 اعرض المجسم في غرفتك (AR)
    </button>
  </model-viewer>

</body>
</html>
